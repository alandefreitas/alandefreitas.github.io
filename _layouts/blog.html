---
layout: default
---

{{ content }}

<ul class="plain-list">
  {% for post in site.posts %}
    <li class="post-item">
      <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      <span><i class="fas fa-feather-alt icon" aria-hidden="true"></i><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></span>
    </li>
  {% endfor %}
</ul>
