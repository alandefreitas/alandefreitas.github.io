url: "https://alandefreitas.github.io" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Alan de Freitas" # the name of your site, e.g. ACME Corp.
description: "Notes from a C++ Engineer."

# Local-only folders that must not be copied into the built site.
exclude:
  - local
  - vendor
  - scripts
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - LICENSE.txt
  - screenshot.png
  - academic.gemspec
  - Gemfile
  - Gemfile.lock

# Posts live under /blog/, whatever folder of _posts they come from.
permalink: /blog/:year/:month/:day/:title/
